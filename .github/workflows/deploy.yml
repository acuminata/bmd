name: build and deploy

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:

concurrency: #A newer push waits until the current run
  group: deploy-ci
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-26.04
    environment: erable
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Set release version
        run: |
          SHA="$(git rev-parse --short HEAD)"
          echo "SHORT_SHA=$SHA" >> "$GITHUB_ENV"

      - name: Build image
        run: docker buildx build --load --cache-from type=gha,scope=bmd --cache-to type=gha,mode=max,scope=bmd -t "bmd:${{ env.SHORT_SHA }}" .

      - name: Save image
        run: docker save "bmd:${{ env.SHORT_SHA }}" | gzip > /tmp/bmd-image.tar.gz

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload and load image
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
        run: |
          
          #Upload
          scp -i ~/.ssh/vps_key -P "$VPS_PORT" /tmp/bmd-image.tar.gz "$VPS_USER"@"$VPS_HOST":/tmp/bmd-image.tar.gz
          
          #load
          ssh -i ~/.ssh/vps_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'docker load -i /tmp/bmd-image.tar.gz'


      - name: Upload and install service timer
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          SHORT_SHA: ${{ env.SHORT_SHA }}
        run: |
          scp -i ~/.ssh/vps_key -P "$VPS_PORT" -r .github/files/systemd "$VPS_USER"@"$VPS_HOST":/tmp/bmd-deploy
          
          ssh -i ~/.ssh/vps_key -p "$VPS_PORT" "$VPS_USER"@"$VPS_HOST" "IMAGE=bmd:$SHORT_SHA bash -s" <<'EOF'
          set -euo pipefail
          sudo mkdir -p /etc/bmd
          
          if [ ! -f /etc/bmd/env ]; then
            sudo install -m 600 /dev/null /etc/bmd/env
            echo "NOTE: created empty /etc/bmd/env - fill in BMD_COOKIE and S3_* secrets"
          fi
          
          if sudo grep -q '^IMAGE=' /etc/bmd/env; then
            sudo sed -i "s|^IMAGE=.*|IMAGE=$IMAGE|" /etc/bmd/env
          else
            echo "IMAGE=$IMAGE" | sudo tee -a /etc/bmd/env >/dev/null
          fi
          
          sudo cp /tmp/bmd-deploy/bmd-fetch.service /tmp/bmd-deploy/bmd-fetch.timer /etc/systemd/system/
          
          sudo systemctl daemon-reload
          
          sudo systemctl enable --now bmd-fetch.timer
          sudo systemctl restart bmd-fetch.service
          EOF

      - name: Cleanup
        if: always()
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/vps_key -p "$VPS_PORT" "$VPS_USER"@"$VPS_HOST" "KEEP_SHA=${{ env.SHORT_SHA }} bash -s" <<'EOF'
          set -euo pipefail
          
          # Remove temporary deployment files
          rm -f /tmp/bmd-image.tar.gz
          rm -rf /tmp/bmd-deploy
          
           # Remove old Docker images, preserving current SHA
          if [ -n "${KEEP_SHA:-}" ]; then
            docker images bmd --format '{{.Repository}}:{{.Tag}}'  | grep -v -e "bmd:$KEEP_SHA$" | xargs -r docker rmi || true
          fi
          
          EOF
          
          #remove the ssh private key
          rm -f ~/.ssh/vps_key /tmp/bmd-image.tar.gz
